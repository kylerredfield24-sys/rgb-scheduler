name: Build RGB Scheduler

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path rgb_scheduler.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          if (-not $v) { throw "APP_VERSION not found" }
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0   # "no release yet" isn't an error
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pystray pillow numpy psutil pywinauto comtypes
          pip install winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Media.Ocr winrt-Windows.Graphics.Imaging winrt-Windows.Storage.Streams winrt-Windows.Globalization
          exit 0

      - name: Self-test (opens every screen once)
        timeout-minutes: 3
        env:
          APPDATA: ${{ runner.temp }}\appdata
        run: python rgb_scheduler.py --selftest

      - name: Build the .exe
        if: steps.ver.outputs.exists == 'false'
        run: |
          python rgb_scheduler.py --make-icon
          pyinstaller --noconfirm --onefile --windowed --name "RGB-Scheduler" --icon icon.ico `
            --collect-all customtkinter --collect-all winrt `
            --hidden-import pystray._win32 --hidden-import comtypes.stream `
            --hidden-import pywinauto.controls.uia_controls --hidden-import pywinauto.controls.uiawrapper `
            rgb_scheduler.py

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $notes = git log -1 --pretty=%s
          gh release create "v$v" "dist/RGB-Scheduler.exe" --title "RGB Scheduler $v" --notes "$notes"
